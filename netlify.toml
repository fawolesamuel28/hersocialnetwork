[build]
  publish = "."

# Route /admin -> /admin.html cleanly
[[redirects]]
  from   = "/admin"
  to     = "/admin.html"
  status = 200

# Custom 404 page — Netlify serves this for all unmatched routes
[[redirects]]
  from   = "/*"
  to     = "/404.html"
  status = 404

# Security headers applied to all pages
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options       = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy       = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self' https://cdn.jsdelivr.net https://static.cloudflareinsights.com; connect-src 'self' https://*.supabase.co https://cdn.jsdelivr.net https://cloudflareinsights.com; base-uri 'self'; form-action 'self';"

# Cache static assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "*.html"
  [headers.values]
    Cache-Control = "no-cache"
